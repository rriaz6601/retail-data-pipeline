version: 2

models:
  - name: int_pos_matched
    columns:
      - name: txn_id
        tests: [unique]
  - name: fct_sales
    columns:
      - name: sale_id
        tests: [not_null, unique]
      - name: customer_email
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_email
  - name: dim_customers
    columns:
      - name: customer_email
        tests: [not_null, unique]
