[project]
name = "retail-data-pipeline"
version = "0.1.0"
description = "Synthetic multi-source retail sales pipeline: Prefect + dbt + Postgres"
requires-python = ">=3.11"
dependencies = [
    "prefect>=2.19",
    "psycopg[binary]>=3.1",
    "faker>=25.0",
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
